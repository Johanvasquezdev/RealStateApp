<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <radialGradient id="redGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#B22222"/>
      <stop offset="100%" stop-color="#7B0000"/>
    </radialGradient>
    <radialGradient id="goldGrad" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="40%" stop-color="#DAA520"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </radialGradient>
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="30%" stop-color="#FFC125"/>
      <stop offset="50%" stop-color="#DAA520"/>
      <stop offset="70%" stop-color="#FFC125"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="flagRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CE1126"/>
      <stop offset="100%" stop-color="#A0001C"/>
    </linearGradient>
    <linearGradient id="flagBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002D62"/>
      <stop offset="100%" stop-color="#001A40"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <clipPath id="ovalClip">
      <ellipse cx="200" cy="240" rx="185" ry="225"/>
    </clipPath>
  </defs>

  <!-- Outer red oval -->
  <ellipse cx="200" cy="240" rx="190" ry="230" fill="url(#redGrad)" stroke="url(#goldMetal)" stroke-width="6"/>

  <!-- Inner gold ring -->
  <ellipse cx="200" cy="240" rx="175" ry="215" fill="none" stroke="url(#goldMetal)" stroke-width="2"/>

  <!-- Gold border ring -->
  <ellipse cx="200" cy="240" rx="188" ry="228" fill="none" stroke="#B8860B" stroke-width="1"/>

  <!-- Top text: REPÚBLICA DOMINICANA -->
  <path id="topArc" d="M 60,240 A 155,190 0 0,1 340,240" fill="none"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="bold" fill="url(#goldMetal)" letter-spacing="3">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">REPÚBLICA DOMINICANA</textPath>
  </text>

  <!-- Bottom text: SUPERINTENDENCIA DE VIGILANCIA Y SEGURIDAD PRIVADA -->
  <path id="bottomArc" d="M 55,260 A 160,195 0 0,0 345,260" fill="none"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-weight="bold" fill="url(#goldMetal)" letter-spacing="1.5">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">SUPERINTENDENCIA DE VIGILANCIA Y SEGURIDAD PRIVADA</textPath>
  </text>

  <!-- === CENTER EMBLEM === -->

  <!-- Dominican Flag Left (crossed) -->
  <g transform="translate(120, 200) rotate(-15, 80, 100)">
    <!-- Flag pole -->
    <rect x="75" y="-10" width="4" height="200" fill="url(#goldMetal)" rx="2"/>
    <circle cx="77" cy="-12" r="5" fill="url(#goldMetal)"/>
    <!-- Flag fabric -->
    <path d="M 79,0 L 10,10 Q 15,45 8,80 L 79,70 Z" fill="url(#flagRed)"/>
    <path d="M 79,70 L 8,80 Q 15,115 10,150 L 79,140 Z" fill="url(#flagBlue)"/>
    <!-- White cross on flag -->
    <path d="M 79,0 L 45,35 L 45,140 L 79,140 Z" fill="white" opacity="0.9"/>
    <path d="M 79,0 L 10,55 L 45,55 L 45,35 Z" fill="white" opacity="0.9"/>
    <rect x="10" y="55" width="35" height="30" fill="white" opacity="0.9"/>
  </g>

  <!-- Dominican Flag Right (crossed) -->
  <g transform="translate(170, 200) rotate(15, 80, 100) scale(-1,1) translate(-200, 0)">
    <!-- Flag pole -->
    <rect x="115" y="-10" width="4" height="200" fill="url(#goldMetal)" rx="2"/>
    <circle cx="117" cy="-12" r="5" fill="url(#goldMetal)"/>
    <!-- Flag fabric -->
    <path d="M 119,0 L 50,10 Q 55,45 48,80 L 119,70 Z" fill="url(#flagRed)"/>
    <path d="M 119,70 L 48,80 Q 55,115 50,150 L 119,140 Z" fill="url(#flagBlue)"/>
    <!-- White cross on flag -->
    <path d="M 119,0 L 85,35 L 85,140 L 119,140 Z" fill="white" opacity="0.9"/>
    <path d="M 119,0 L 50,55 L 85,55 L 85,35 Z" fill="white" opacity="0.9"/>
    <rect x="50" y="55" width="35" height="30" fill="white" opacity="0.9"/>
  </g>

  <!-- Gold Shield -->
  <g filter="url(#shadow)">
    <path d="M 200,160 L 240,180 L 245,240 Q 245,290 200,310 Q 155,290 155,240 L 160,180 Z"
          fill="url(#goldGrad)" stroke="#8B6914" stroke-width="2"/>
    <!-- Shield inner border -->
    <path d="M 200,168 L 234,185 L 238,240 Q 238,284 200,302 Q 162,284 162,240 L 166,185 Z"
          fill="none" stroke="#8B6914" stroke-width="1"/>
    <!-- Shield emblem details -->
    <path d="M 200,195 L 210,210 L 225,215 L 215,228 L 218,245 L 200,235 L 182,245 L 185,228 L 175,215 L 190,210 Z"
          fill="#8B0000" stroke="#8B6914" stroke-width="0.5"/>
    <!-- Cross on shield -->
    <rect x="196" y="200" width="8" height="60" fill="url(#goldMetal)" rx="1"/>
    <rect x="180" y="218" width="40" height="8" fill="url(#goldMetal)" rx="1"/>
  </g>

  <!-- Heraldic Eagle -->
  <g transform="translate(200, 140)" filter="url(#shadow)">
    <!-- Eagle body -->
    <ellipse cx="0" cy="10" rx="14" ry="18" fill="url(#goldMetal)"/>
    <!-- Eagle head -->
    <circle cx="0" cy="-8" r="8" fill="url(#goldMetal)"/>
    <!-- Beak -->
    <path d="M 6,-10 L 14,-8 L 6,-5 Z" fill="#8B6914"/>
    <!-- Eye -->
    <circle cx="2" cy="-10" r="1.5" fill="#000"/>
    <!-- Left wing -->
    <path d="M -10,5 Q -35,-15 -50,-25 Q -40,-5 -25,0 Q -35,5 -45,10 Q -30,10 -15,8 Z"
          fill="url(#goldMetal)" stroke="#8B6914" stroke-width="0.5"/>
    <!-- Right wing -->
    <path d="M 10,5 Q 35,-15 50,-25 Q 40,-5 25,0 Q 35,5 45,10 Q 30,10 15,8 Z"
          fill="url(#goldMetal)" stroke="#8B6914" stroke-width="0.5"/>
    <!-- Wing feather lines -->
    <line x1="-15" y1="0" x2="-42" y2="-18" stroke="#8B6914" stroke-width="0.5"/>
    <line x1="-12" y1="3" x2="-38" y2="-10" stroke="#8B6914" stroke-width="0.5"/>
    <line x1="15" y1="0" x2="42" y2="-18" stroke="#8B6914" stroke-width="0.5"/>
    <line x1="12" y1="3" x2="38" y2="-10" stroke="#8B6914" stroke-width="0.5"/>
    <!-- Tail feathers -->
    <path d="M -5,28 L -10,45 L 0,38 L 10,45 L 5,28 Z" fill="url(#goldMetal)" stroke="#8B6914" stroke-width="0.5"/>
  </g>

  <!-- Star above eagle -->
  <g transform="translate(200, 88)">
    <polygon points="0,-12 3,-4 12,-4 5,2 7,11 0,6 -7,11 -5,2 -12,-4 -3,-4"
             fill="url(#goldMetal)" stroke="#8B6914" stroke-width="0.5"/>
  </g>

  <!-- Decorative gold dots around inner ring -->
  <g fill="url(#goldMetal)">
    <circle cx="200" cy="18" r="3"/>
    <circle cx="130" cy="30" r="2.5"/>
    <circle cx="270" cy="30" r="2.5"/>
    <circle cx="70" cy="70" r="2.5"/>
    <circle cx="330" cy="70" r="2.5"/>
    <circle cx="30" cy="140" r="2.5"/>
    <circle cx="370" cy="140" r="2.5"/>
    <circle cx="18" cy="220" r="2.5"/>
    <circle cx="382" cy="220" r="2.5"/>
    <circle cx="30" cy="310" r="2.5"/>
    <circle cx="370" cy="310" r="2.5"/>
    <circle cx="70" cy="390" r="2.5"/>
    <circle cx="330" cy="390" r="2.5"/>
    <circle cx="140" cy="445" r="2.5"/>
    <circle cx="260" cy="445" r="2.5"/>
    <circle cx="200" cy="462" r="3"/>
  </g>
</svg>
